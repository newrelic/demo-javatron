---
# `mvn clean package` occasionally fails with transient Maven Central
# network errors (e.g. "Connection reset" while fetching a transitive
# pom). Retry up to 3 times with a 30-second back-off so a single
# flaky download doesn't fail the whole deployer test run.
- name: Clean previous and build
  shell: '/opt/apache-maven/bin/mvn clean package'
  args:
    chdir: /home/{{ ansible_user }}/{{ service_id }}
  environment:
    JAVA_HOME: /opt/jdk-14.0.1
  register: mvn_build
  retries: 3
  delay: 30
  until: mvn_build.rc == 0

- name: Remove any previous deployed war
  file:
    path: /opt/tomcat/latest/webapps/api.war
    state: absent
  become: yes

- name: Copy output
  shell: 'cp /home/{{ ansible_user }}/{{ service_id }}/target/*.war /opt/tomcat/latest/webapps/api.war'
  become: yes

- name: Configure port
  shell: 'sed -i "s,8080,{{ service_port }}," /opt/tomcat/latest/conf/server.xml'
  become: yes
